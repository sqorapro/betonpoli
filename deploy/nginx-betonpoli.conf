# /etc/nginx/sites-available/betonpoli.ru → ln -s в sites-enabled
# SSL: certbot --nginx -d betonpoli.ru -d www.betonpoli.ru
server {
    listen 80;
    server_name betonpoli.ru www.betonpoli.ru;
    return 301 https://betonpoli.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.betonpoli.ru;
    # ssl_certificate / ssl_certificate_key — пропишет certbot
    return 301 https://betonpoli.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name betonpoli.ru;
    # ssl_certificate / ssl_certificate_key — пропишет certbot

    client_max_body_size 30m;

    # фото товаров — напрямую с диска, имена уникальные
    location /media/ {
        alias /opt/betonpoli/deploy/data/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
